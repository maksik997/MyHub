<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyHub - Studies</title>
    <link th:href="@{/images/logo.png}" rel="icon" type="image/x-icon">
    <!-- GENERAL -->
    <link th:href="@{/stylesheets/stylesheet.css}" rel="stylesheet">
    <!-- COMPONENTS -->
    <link th:href="@{/stylesheets/components/_components.css}" rel="stylesheet">
    <!-- TEMPLATE SPECIFIC -->
    <link th:href="@{/stylesheets/studies.css}" rel="stylesheet">
</head>
<body>

    <header th:replace="~{ layout :: header('studies') }"></header>

    <main>
        <nav>
            <h1>Studies:</h1>
            <a class="button" th:href="@{/studies/add}">New subject</a>
        </nav>

        <div th:replace="~{ components :: message(${ message }) }"></div>

        <div th:replace="~{ components :: filterForm('subjects', ${ page }, ${ sortOptions }, ${ sortBy }, ${ orderBy }) }"></div>

        <!-- SUBJECTS -->
        <div class="subjects">
            <p th:if="${page.totalElements == 0}">
                No subjects have been found.
            </p>
            <table class="table-panel" th:if="${page.totalElements > 0}">
                <thead>
                    <tr>
                        <th>Code</th> <!-- 2 to 4 alphanumeric characters -->
                        <th>Name</th> <!-- With ellipsis -->
                        <th>Creation date</th>
                        <th>Modification date</th>
                        <th>Details</th> <!-- Show details -->
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="subject : ${page.content}">
                        <td th:text="${subject.code}">
                            Code
                        </td>
                        <td th:text="${subject.name}">
                            Name
                        </td>
                        <td th:text="${#temporals.format(subject.creationDate, 'dd-MM-yyyy HH:mm')}">
                            Creation date
                        </td>
                        <td th:text="${#temporals.format(subject.modificationDate, 'dd-MM-yyyy HH:mm')}">
                            Modification date
                        </td>
                        <td>
                            <a th:href="@{/studies/{id}(id=${subject.id})}">
                                Details
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer th:replace="~{ layout :: footer() }"></footer>

    <script>
        /* TODO: Move to .js file */
        'use strict';

        const changePage = (event, isAscending) => {
            event.preventDefault();

            const pageField = document.getElementById("page");
            if (!pageField) {
                console.error("Page field not found.");
                return;
            }

            const value = parseInt(pageField.value) + parseInt(isAscending ? +1 : -1);
            if (value <= 0) {
                console.debug("New value out of bounds.");
                return;
            }

            // Set new value
            pageField.value = value;

            // Continue with event
            const form = document.getElementById("filter-form");
            if (form) { handleFilters(event); }
            else { console.error("Form is undefined."); }
        };

        const handleFilters = (event) => {
            event.preventDefault();

            const baseUrl = "/studies";

            // Get data
            const page = document.getElementById("page").value || 0; /// <- Fallback
            const size = document.getElementById("size").value || 10; /// <- Fallback
            const sort = document.getElementById("sort-by").value;
            const order = document.getElementById("order-by").value;
            const name = document.getElementById("name-of").value;

            // Build url
            let url = `${baseUrl}?page=${page - 1}&size=${size}`;
            if (sort && order) {
                url += `&sort=${encodeURIComponent(sort)},${order}`;
            }
            if (name) {
                url += `&nameOf=${encodeURIComponent(name)}`;
            }

            // Send request
            location.href = url;
        };

    </script>

</body>
</html>
