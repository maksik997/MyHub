<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

    <form th:action="@{/games/add}"
          method="post"
          enctype="multipart/form-data">

        <label>Name:</label>
        <input type="text" th:name="name"/>

        <label>Game files</label>
        <input type="file" th:name="file">

        <button type="submit">Submit</button>

    </form>

</body>
</html>
