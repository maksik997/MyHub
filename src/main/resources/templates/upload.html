<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyHub - Gallery upload</title>
    <link th:href="@{/images/logo.png}" rel="icon" type="image/x-icon">
    <!-- GENERAL -->
    <link th:href="@{/stylesheets/stylesheet.css}" rel="stylesheet">
    <!-- COMPONENTS -->
    <link th:href="@{/stylesheets/components.css}" rel="stylesheet">
    <link th:href="@{/stylesheets/components/layout.css}" rel="stylesheet">
    <link th:href="@{/stylesheets/components/message.css}" rel="stylesheet">
    <!-- TEMPLATE SPECIFIC -->
    <link th:href="@{/stylesheets/upload_page.css}" rel="stylesheet">
</head>
<body>

    <header th:replace="~{ layout :: header('media-upload') }"></header>

    <main>
        <p class="note">
            <b>Note from developer:</b><br>
            This subpage will be moved to the "/media" page.<br>
            In a future version, this subpage will be removed.<br>
            Until then, it will remain as it is.
        </p>

        <div>
            <h1>Upload media:</h1>
        </div>

        <form th:if="${message == ''}" th:action="@{/media/upload}" method="post" enctype="multipart/form-data">
            <label for="files">Choose a file to upload:</label>
            <input type="file" name="files" id="files" accept="image/*,video/*" multiple>
            <button type="submit">Upload</button>
        </form>

        <div th:if="${message != ''}">
            <p th:text="${message}">Status:</p>
        </div>
    </main>

    <footer th:replace="~{ layout :: footer() }"></footer>

</body>
</html>
